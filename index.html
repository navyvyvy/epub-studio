<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB STUDIO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jschardet/3.0.0/jschardet.min.js"></script>
    <style>
        :root {
            --bg: #0b0f1a;
            --card: #161b2c;
            --primary: #6366f1;
            --accent: #818cf8;
            --border: #2d334a;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --scroll-track: #0d111d;
            --scroll-thumb: #2d334a;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
            color: var(--text);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--scroll-track); }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .container {
            background: var(--card);
            width: 700px;
            height: 920px;
            display: flex;
            flex-direction: column;
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.2rem;
            margin: 0;
            letter-spacing: 4px;
            font-weight: 900;
        }

        h2 span { color: var(--primary); }

        .config-section {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 18px;
            margin-bottom: 15px;
        }

        .options-bar {
            display: flex;
            gap: 18px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .regex-area { transition: 0.3s; }

        .regex-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .regex-label {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 700;
        }

        #regexInput {
            background: #0b0f1a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 10px 14px;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .file-list-area {
            flex-grow: 1;
            overflow: hidden;
            background: #0d111d;
            border-radius: 16px;
            border: 2px dashed var(--border);
            margin-bottom: 20px;
            position: relative;
            transition: 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .file-list-area.drag-over {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            border-style: solid;
        }

        .table-wrapper {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .table-wrapper.active { display: flex; }

        .file-table-header {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background: #1c2336;
            z-index: 2;
        }

        .file-table-header th {
            padding: 12px;
            color: var(--text-dim);
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border);
        }

        .table-scroll-box {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
        }

        .file-table-body {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 0.8rem;
        }

        .file-table-body td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            background: #0d111d;
        }

        .col-title { text-align: left; padding-left: 15px; }
        .col-enc { width: 90px; text-align: center; }
        .col-valid { width: 85px; text-align: center; }
        .col-status { width: 85px; text-align: center; }
        .col-action { width: 70px; text-align: center; }

        .title-input {
            background: none;
            border: none;
            color: var(--text);
            width: 100%;
            outline: none;
            font-size: 0.8rem;
        }

        .btn-header-action {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-header-action:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge-wait { background: #2d334a; color: var(--text-dim); }
        .badge-done { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid var(--success); }
        .badge-ing { background: rgba(99, 102, 241, 0.15); color: var(--primary); border: 1px solid var(--primary); }
        .badge-error { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }

        .empty-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-dim);
            font-size: 0.9rem;
            text-align: center;
            pointer-events: none;
            line-height: 1.6;
        }

        .controls { display: flex; gap: 12px; }

        .btn-start {
            flex: 1;
            height: 55px;
            background: var(--primary);
            border: none;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-start:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .btn-start:disabled {
            background: #2d334a;
            cursor: not-allowed;
            transform: none;
        }

        .btn-stop {
            width: 80px;
            height: 55px;
            background: transparent;
            border: 2px solid var(--danger);
            border-radius: 14px;
            font-weight: 700;
            color: var(--danger);
            cursor: pointer;
            display: none;
        }

        #status {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-dim);
            min-height: 1.2rem;
        }

        .progress-bar {
            height: 6px;
            background: #2d334a;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><span>EPUB</span> STUDIO</h2>
    </div>

    <div class="config-section">
        <div class="options-bar">
            <label class="option-item"><input type="checkbox" id="optTrim" checked> 공백 정제</label>
            <label class="option-item"><input type="checkbox" id="optToc" checked> 목차 자동 추출</label>
            <label class="option-item"><input type="checkbox" id="optZip"> 완료 후 ZIP 압축</label>
        </div>
        <div class="regex-area">
            <div class="regex-label-row">
                <div class="regex-label">목차 추출 정규식 (Flux 아키텍처 및 선언적 UI 적용)</div>
            </div>
            <input type="text" id="regexInput" value="^\s*(([<【〔]\s*(\d+[\.\s화]|제?\s*\d+화|자기\s*소개|프롤로그|에필로그|공지|작가).*?[>】〕])|제?\s*\d+[화회](?![이가을를은는의])(?:\s.{1,70})?$|Chapter\s*\d+.*?|^[#＃]\d+.*?$|(?!\d*\.?\d+\s*(?:년|월|일|시|분|초|미터|km|살|차|퍼센트|%|배|개|명|번|회분|곱하기|x|\*))\d*\.?\d+[\s\.화].{1,70}(?<![고다자죠요]\.)$|\(\d+\)$)\s*$">
        </div>
    </div>

    <div class="file-list-area" id="dropZone">
        <div class="empty-msg" id="emptyMsg">텍스트 파일을 드래그하거나<br>클릭하여 추가하세요</div>
        <div class="table-wrapper" id="tableWrapper">
            <table class="file-table-header">
                <thead>
                    <tr>
                        <th class="col-title">도서 제목</th>
                        <th class="col-enc">인코딩</th>
                        <th class="col-valid">감지</th>
                        <th class="col-status">상태</th>
                        <th class="col-action">
                            <button type="button" id="clearAllBtn" class="btn-header-action">✕</button>
                        </th>
                    </tr>
                </thead>
            </table>
            <div class="table-scroll-box">
                <table class="file-table-body">
                    <tbody id="fileTbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" multiple accept=".txt" style="display:none">

    <div class="controls">
        <button type="button" class="btn-start" id="convertBtn">EPUB 변환 시작</button>
        <button type="button" class="btn-stop" id="stopBtn">중단</button>
    </div>

    <div id="status">대기 중</div>
    <div class="progress-bar" id="progBar"><div class="progress-fill" id="progFill"></div></div>
</div>

<script>
    /**
     * ==========================================
     * [ITEM 2] 상태 관리소 (State Store)
     * ==========================================
     * 전역 변수들의 혼재를 막고, 오직 dispatch를 통해 예측 가능하게 상태를 제어합니다.
     */
    class Store {
        constructor(initialState) {
            this.state = initialState;
            this.listeners = [];
        }

        subscribe(listener) {
            this.listeners.push(listener);
        }

        dispatch(action) {
            this.state = this.reducer(this.state, action);
            this.listeners.forEach(listener => listener(this.state, action));
        }

        reducer(state, action) {
            switch (action.type) {
                case 'ADD_FILES':
                    return { ...state, files: [...state.files, ...action.payload] };
                case 'REMOVE_FILE':
                    return { ...state, files: state.files.filter(f => f.id !== action.payload) };
                case 'CLEAR_FILES':
                    return { ...state, files: [], progress: 0, statusText: "대기 중" };
                case 'UPDATE_FILE_TITLE':
                    return { ...state, files: state.files.map(f => f.id === action.payload.id ? { ...f, customTitle: action.payload.title } : f) };
                case 'UPDATE_FILE_VALIDITY':
                    return { ...state, files: state.files.map(f => f.id === action.payload.id ? { ...f, isValid: action.payload.isValid } : f) };
                case 'UPDATE_FILE_STATUS':
                    return { ...state, files: state.files.map(f => f.id === action.payload.id ? { ...f, state: action.payload.status } : f) };
                case 'START_PROCESSING':
                    return { ...state, isProcessing: true, shouldStop: false, statusText: "변환 중..." };
                case 'SET_PROGRESS':
                    return { ...state, progress: action.payload };
                case 'STOP_PROCESSING':
                    return { ...state, shouldStop: true, statusText: "중단 요청됨..." };
                case 'FINISH_PROCESSING':
                    return { ...state, isProcessing: false, shouldStop: false, statusText: state.shouldStop ? "중단됨" : "모든 작업 완료!" };
                default:
                    return state;
            }
        }
    }

    const store = new Store({
        files: [],
        isProcessing: false,
        shouldStop: false,
        progress: 0,
        statusText: "대기 중"
    });

    /**
     * ==========================================
     * [ITEM 3] 선언적 UI 렌더링 함수 (Declarative View)
     * ==========================================
     * React의 createElement처럼 직관적으로 DOM을 구성하며 XSS를 완벽히 차단합니다.
     */
    function el(tag, attributes = {}, ...children) {
        const element = document.createElement(tag);

        for (const [key, value] of Object.entries(attributes)) {
            if (key.startsWith('on') && typeof value === 'function') {
                element.addEventListener(key.slice(2).toLowerCase(), value);
            } else if (key === 'className') {
                element.className = value;
            } else if (key === 'style' && typeof value === 'object') {
                Object.assign(element.style, value);
            } else {
                element.setAttribute(key, value);
            }
        }

        children.forEach(child => {
            if (child instanceof Node) {
                element.appendChild(child);
            } else if (child !== null && child !== undefined && typeof child !== 'boolean') {
                element.appendChild(document.createTextNode(child));
            }
        });

        return element;
    }

    /**
     * DOM 엘리먼트 캐싱
     */
    const dom = {
        fileInput: document.getElementById('fileInput'),
        dropZone: document.getElementById('dropZone'),
        fileTbody: document.getElementById('fileTbody'),
        tableWrapper: document.getElementById('tableWrapper'),
        emptyMsg: document.getElementById('emptyMsg'),
        convertBtn: document.getElementById('convertBtn'),
        stopBtn: document.getElementById('stopBtn'),
        regexInput: document.getElementById('regexInput'),
        optToc: document.getElementById('optToc'),
        optTrim: document.getElementById('optTrim'),
        optZip: document.getElementById('optZip'),
        statusText: document.getElementById('status'),
        progFill: document.getElementById('progFill'),
        progBar: document.getElementById('progBar'),
        clearAllBtn: document.getElementById('clearAllBtn')
    };

    /**
     * Store 구독 - 상태 변화에 따른 UI 자동 업데이트
     */
    store.subscribe((state, action) => {
        // UI 상태 동기화
        dom.convertBtn.disabled = state.isProcessing;
        dom.stopBtn.style.display = (state.isProcessing && !state.shouldStop) ? 'block' : 'none';
        dom.progBar.style.display = state.isProcessing ? 'block' : 'none';
        dom.progFill.style.width = `${state.progress}%`;
        dom.statusText.innerText = state.statusText;

        dom.emptyMsg.style.display = state.files.length ? 'none' : 'block';
        dom.tableWrapper.classList.toggle('active', state.files.length > 0);

        // 리스트 재렌더링 (입력 중 포커스 손실을 막기 위해 타이틀 업데이트 시에는 리렌더링 생략)
        if (['ADD_FILES', 'REMOVE_FILE', 'CLEAR_FILES', 'UPDATE_FILE_VALIDITY', 'UPDATE_FILE_STATUS'].includes(action.type)) {
            renderList(state.files);
        }
    });

    /**
     * 리스트 렌더링 (선언적 UI 적용)
     */
    function renderList(files) {
        dom.fileTbody.innerHTML = '';

        const rows = files.map(item => {
            // 유효성 체크 뱃지 구성
            let validSpan;
            if (item.isValid === 'ok') validSpan = el('span', { style: { color: 'var(--success)' } }, '✓');
            else if (item.isValid === 'no') validSpan = el('span', { style: { color: 'var(--danger)' } }, '!');
            else validSpan = el('span', { style: { color: 'var(--text-dim)' } }, '-');

            return el('tr', {},
                // 타이틀 입력 (XSS 안전)
                el('td', { className: 'col-title' },
                    el('input', {
                        type: 'text',
                        className: 'title-input',
                        value: item.customTitle,
                        onInput: (e) => store.dispatch({ type: 'UPDATE_FILE_TITLE', payload: { id: item.id, title: e.target.value } })
                    })
                ),
                el('td', { className: 'col-enc' }, item.encoding),
                el('td', { className: 'col-valid' }, validSpan),
                el('td', { className: 'col-status' },
                    el('span', { className: `status-badge badge-${item.state}` }, item.state)
                ),
                // 개별 삭제 버튼
                el('td', { className: 'col-action' },
                    el('button', {
                        type: 'button',
                        className: 'btn-header-action',
                        onClick: () => store.dispatch({ type: 'REMOVE_FILE', payload: item.id })
                    }, '✕')
                )
            );
        });

        rows.forEach(row => dom.fileTbody.appendChild(row));
    }


    /**
     * Web Worker 스크립트 (이전 단계 100% 유지)
     */
    const workerCode = `
        importScripts("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");

        class TextParser {
            constructor(customRegexStr = null) {
                this.customRegex = customRegexStr ? new RegExp(customRegexStr) : null;
                this.bannedRegex = /\\d*\\.?\\d+\\s*(?:년|월|일|시|분|초|미터|km|살|차|퍼센트|%|배|개|명|번|회분|곱하기|x|\\*)/i;
                this.sentenceEndRegex = /[고다자죠요]\\.$/;
            }

            isTitle(line, index, array) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.length > 120) return false;
                if (this.bannedRegex.test(trimmed)) return false;

                let isCandidate = false;
                if (this.customRegex) {
                    isCandidate = this.customRegex.test(trimmed);
                } else {
                    const isBracket = /^[<【〔]\\s*(\\d+[\\.\\s화]|제?\\s*\\d+화|자기\\s*소개|프롤로그|에필로그|공지|작가).*?[>】〕]/.test(trimmed);
                    const isChapter = /^(?:Chapter\\s*\\d+|[#＃]\\d+)/i.test(trimmed);
                    const isHwaHoe = /^(?:제?\\s*\\d+[화회])/.test(trimmed) || /^\\d*\\.?\\d+화[\\s\\.]/.test(trimmed);
                    isCandidate = isBracket || isChapter || isHwaHoe;
                }

                if (!isCandidate) return false;

                const isHoe = trimmed.includes('회');
                const isHwaPattern = /^\\d*\\.?\\d+화[\\s\\.]/.test(trimmed);

                if (isHoe || isHwaPattern) {
                    if (this.sentenceEndRegex.test(trimmed)) return false;
                    const isPrevEmpty = (index === 0 || array[index - 1].trim() === "");
                    const isNextEmpty = (index === array.length - 1 || array[index + 1].trim() === "");
                    return isPrevEmpty && isNextEmpty;
                }

                return true;
            }
        }

        const escapeXml = (s) => s.replace(/[<>&"']/g, m => ({
            '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": "&apos;"
        }[m]));

        self.onmessage = async function(e) {
            const { type, payload } = e.data;

            if (type === 'VALIDATE') {
                const { id, text, userRegex } = payload;
                const parser = new TextParser(userRegex);
                const lines = text.split('\\n');
                const isValid = lines.some((l, i) => parser.isTitle(l, i, lines)) ? 'ok' : 'no';
                self.postMessage({ type: 'VALIDATE_RESULT', payload: { id, isValid } });
            }
            else if (type === 'CONVERT') {
                const { id, title, content, useTrim, useAutoToc, userRegex } = payload;
                const parser = new TextParser(userRegex);
                const rawLines = content.replace(/\\r\\n/g, '\\n').split('\\n');
                const chapters = [];
                let currentChapter = { title: "시작", lines: [] };

                rawLines.forEach((line, i) => {
                    const trimmed = line.trim();
                    const isTitle = useAutoToc && parser.isTitle(line, i, rawLines);

                    if (isTitle) {
                        if (currentChapter.lines.length > 0) chapters.push(currentChapter);
                        currentChapter = { title: trimmed, lines: [] };
                        return;
                    }
                    if (trimmed !== "" || !useTrim) {
                        currentChapter.lines.push(trimmed);
                    }
                });
                chapters.push(currentChapter);

                const zip = new JSZip();
                zip.file("mimetype", "application/epub+zip", { compression: "STORE" });
                zip.folder("META-INF").file("container.xml",
                    '<?xml version="1.0" encoding="UTF-8"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>'
                );

                const oebps = zip.folder("OEBPS");
                const manifest = [], spine = [], nav = [], ncx = [];

                chapters.forEach((ch, idx) => {
                    const fname = "ch_" + idx + ".xhtml";
                    const safeTitle = escapeXml(ch.title);
                    const bodyHtml = ch.lines.map(l => l ? "<p>" + escapeXml(l) + "</p>" : "<p><br/></p>").join('\\n');

                    const htmlContent = '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ko"><head><title>' + safeTitle + '</title><style>body { font-family: sans-serif; line-height: 1.7; padding: 5% 7%; word-break: break-all; } h2 { border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 1.25em; color: #333; } p { margin: 0.8em 0; text-indent: 0.5em; }</style></head><body><h2>' + safeTitle + '</h2>' + bodyHtml + '</body></html>';
                    oebps.file(fname, htmlContent);

                    manifest.push("<item id=\\"c" + idx + "\\" href=\\"" + fname + "\\" media-type=\\"application/xhtml+xml\\"/>");
                    spine.push("<itemref idref=\\"c" + idx + "\\"/>");
                    nav.push("<li><a href=\\"" + fname + "\\">" + safeTitle + "</a></li>");
                    ncx.push("<navPoint id=\\"n" + idx + "\\" playOrder=\\"" + (idx + 1) + "\\"><navLabel><text>" + safeTitle + "</text></navLabel><content src=\\"" + fname + "\\"/></navPoint>");
                });

                oebps.file("nav.xhtml", '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><title>TOC</title></head><body><nav epub:type="toc"><h1>목차</h1><ol>' + nav.join('\\n') + '</ol></nav></body></html>');
                oebps.file("toc.ncx", '<?xml version="1.0" encoding="UTF-8"?><ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"><head><meta name="dtb:uid" content="uuid"/></head><docTitle><text>' + escapeXml(title) + '</text></docTitle><navMap>' + ncx.join('\\n') + '</navMap></ncx>');

                const randomId = Math.random().toString(36).substring(2, 15);
                oebps.file("content.opf", '<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="uid">u' + randomId + '</dc:identifier><dc:title>' + escapeXml(title) + '</dc:title><dc:language>ko</dc:language><meta property="dcterms:modified">' + new Date().toISOString().replace(/\\.\\d+Z$/, "Z") + '</meta></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>' + manifest.join('\\n') + '</manifest><spine toc="ncx">' + spine.join('\\n') + '</spine></package>');

                const blob = await zip.generateAsync({ type: "blob", mimeType: "application/epub+zip", compression: "DEFLATE" });
                self.postMessage({ type: 'CONVERT_RESULT', payload: { id, blob } });
            }
        };
    `;

    const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    const parserWorker = new Worker(URL.createObjectURL(workerBlob));
    const conversionResolvers = new Map();

    parserWorker.onmessage = function(e) {
        const { type, payload } = e.data;
        if (type === 'VALIDATE_RESULT') {
            store.dispatch({ type: 'UPDATE_FILE_VALIDITY', payload: { id: payload.id, isValid: payload.isValid } });
        }
        else if (type === 'CONVERT_RESULT') {
            if (conversionResolvers.has(payload.id)) {
                conversionResolvers.get(payload.id)(payload.blob);
                conversionResolvers.delete(payload.id);
            }
        }
    };

    /**
     * UI 이벤트 핸들러 결합
     */
    dom.dropZone.onclick = (e) => {
        if (e.target.closest('.btn-header-action') || e.target.closest('.title-input') || e.target.closest('button')) return;
        dom.fileInput.click();
    };

    dom.dropZone.ondragover = (e) => { e.preventDefault(); dom.dropZone.classList.add('drag-over'); };
    dom.dropZone.ondragleave = () => dom.dropZone.classList.remove('drag-over');
    dom.dropZone.ondrop = (e) => {
        e.preventDefault(); e.stopPropagation();
        dom.dropZone.classList.remove('drag-over');
        handleFiles(e.dataTransfer.files);
    };

    dom.fileInput.onchange = (e) => {
        if (e.target.files.length > 0) handleFiles(e.target.files);
        dom.fileInput.value = "";
    };

    async function handleFiles(files) {
        const newFiles = [];
        for (const file of Array.from(files)) {
            if (!file.name.toLowerCase().endsWith('.txt')) continue;

            const buffer = await file.slice(0, 32768).arrayBuffer();
            let binary = "";
            const bytes = new Uint8Array(buffer);
            bytes.forEach(b => binary += String.fromCharCode(b));

            let det = jschardet.detect(binary);
            let enc = (det && det.confidence > 0.7) ? det.encoding.toUpperCase() : 'UTF-8';
            if (["EUC-KR", "CP949"].includes(enc)) enc = "CP949";

            newFiles.push({
                id: Date.now() + '-' + Math.random(),
                file,
                customTitle: file.name.replace(/\.[^/.]+$/, ""),
                encoding: enc,
                state: 'wait',
                isValid: 'none'
            });
        }

        store.dispatch({ type: 'ADD_FILES', payload: newFiles });
        await validateAllFiles();
    }

    async function validateAllFiles() {
        const { files } = store.state;
        for (let item of files) {
            if (item.state === 'done' || item.isValid !== 'none') continue;

            const text = await new Promise(res => {
                const r = new FileReader();
                r.onload = e => res(e.target.result.substring(0, 15000));
                r.readAsText(item.file, item.encoding);
            });

            parserWorker.postMessage({
                type: 'VALIDATE',
                payload: { id: item.id, text, userRegex: dom.regexInput.value }
            });
        }
    }

    dom.convertBtn.onclick = async () => {
        const { files, isProcessing } = store.state;
        if (isProcessing || !files.length) return;

        store.dispatch({ type: 'START_PROCESSING' });

        const reg = dom.regexInput.value;
        const trim = dom.optTrim.checked;
        const toc = dom.optToc.checked;
        const useZip = dom.optZip.checked;
        const finalZip = useZip ? new JSZip() : null;

        for (let i = 0; i < files.length; i++) {
            if (store.state.shouldStop) break;

            const item = files[i];
            if (item.state === 'done') continue;

            store.dispatch({ type: 'UPDATE_FILE_STATUS', payload: { id: item.id, status: 'ing' } });

            try {
                const text = await new Promise(res => {
                    const r = new FileReader();
                    r.onload = e => res(e.target.result);
                    r.readAsText(item.file, item.encoding);
                });

                const blob = await new Promise(resolve => {
                    conversionResolvers.set(item.id, resolve);
                    parserWorker.postMessage({
                        type: 'CONVERT',
                        payload: {
                            id: item.id,
                            title: item.customTitle,
                            content: text,
                            useTrim: trim,
                            useAutoToc: toc,
                            userRegex: reg
                        }
                    });
                });

                if (useZip) {
                    finalZip.file(`${item.customTitle}.epub`, blob);
                } else {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `${item.customTitle}.epub`;
                    a.click();
                    URL.revokeObjectURL(a.href);
                }
                store.dispatch({ type: 'UPDATE_FILE_STATUS', payload: { id: item.id, status: 'done' } });
            } catch (e) {
                console.error(e);
                store.dispatch({ type: 'UPDATE_FILE_STATUS', payload: { id: item.id, status: 'error' } });
            }

            store.dispatch({ type: 'SET_PROGRESS', payload: ((i + 1) / files.length) * 100 });
        }

        if (useZip && !store.state.shouldStop) {
            const b = await finalZip.generateAsync({ type: "blob" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = `EPUB_COLLECTION.zip`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        store.dispatch({ type: 'FINISH_PROCESSING' });
    };

    dom.stopBtn.onclick = () => store.dispatch({ type: 'STOP_PROCESSING' });
    dom.clearAllBtn.onclick = () => {
        if (!store.state.isProcessing) store.dispatch({ type: 'CLEAR_FILES' });
    };
</script>
</body>
</html>
