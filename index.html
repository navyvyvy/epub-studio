<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB STUDIO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jschardet/3.0.0/jschardet.min.js"></script>
    <style>
        :root {
            --bg: #0b0f1a;
            --card: #161b2c;
            --primary: #6366f1;
            --accent: #818cf8;
            --border: #2d334a;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --scroll-track: #0d111d;
            --scroll-thumb: #2d334a;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Pretendard', system-ui, sans-serif;
            color: var(--text);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--scroll-track); }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .container {
            background: var(--card);
            width: 760px;
            height: 920px;
            display: flex;
            flex-direction: column;
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h2 { font-size: 1.1rem; margin: 0; letter-spacing: 3px; font-weight: 900; }
        h2 span { color: var(--primary); }

        .config-section {
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 15px;
        }

        .options-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
        .options-group { display: flex; gap: 20px; }
        .option-item { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }

        .btn-advanced-toggle {
            font-size: 0.75rem;
            color: var(--text-dim);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0;
        }
        .btn-advanced-toggle:hover { color: var(--text); }
        .btn-advanced-toggle .arrow { transition: 0.3s; font-size: 0.6rem; }
        .btn-advanced-toggle.open .arrow { transform: rotate(180deg); }

        .regex-area { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border); }
        .regex-area.open { display: block; }

        #regexInput, #testInput {
            background: #0b0f1a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 8px 12px;
            font-size: 0.75rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
        }
        #testInput { font-family: 'Pretendard', sans-serif; resize: vertical; }

        #btnTestParser {
            background: var(--primary);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #btnTestParser:hover { background: var(--accent); }

        #testOutput {
            margin-top: 10px;
            background: #0d111d;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.75rem;
            color: var(--text-dim);
            min-height: 40px;
            max-height: 120px;
            overflow-y: auto;
        }

        .file-list-area {
            flex-grow: 1;
            overflow: hidden;
            background: #0d111d;
            border-radius: 16px;
            border: 2px dashed var(--border);
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .table-wrapper { display: none; flex-direction: column; height: 100%; width: 100%; }
        .table-wrapper.active { display: flex; }
        .table-scroll-box { flex-grow: 1; overflow-y: auto; overflow-x: hidden; width: 100%; }

        .file-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 0.75rem; }
        .file-table th { position: sticky; top: 0; background: #1c2336; z-index: 2; padding: 10px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
        .file-table td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; background: #0d111d; text-align: center; }
        .file-table th.col-title, .file-table td.col-title { text-align: left; padding-left: 15px; }

        .title-input { background: none; border: none; color: var(--text); width: 100%; outline: none; font-size: 0.75rem; }
        .btn-header-action { background: none; border: 1px solid var(--border); color: var(--text-dim); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; }
        .btn-header-action:hover { border-color: var(--accent); color: var(--text); }

        .cover-btn-group { display: flex; gap: 4px; justify-content: center; }
        .btn-cover { background: #2d334a; border: 1px solid var(--border); color: var(--text-dim); padding: 3px 8px; font-size: 0.65rem; border-radius: 4px; cursor: pointer; }
        .btn-cover.active { background: rgba(34,197,94,0.15); border-color: var(--success); color: var(--success); }

        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.6rem; font-weight: 800; }
        .badge-wait { background: #2d334a; color: var(--text-dim); }
        .badge-done { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid var(--success); }
        .badge-ing { background: rgba(99,102,241,0.15); color: var(--primary); border: 1px solid var(--primary); }
        .badge-error { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid var(--danger); }

        .empty-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--text-dim); font-size: 0.85rem; pointer-events: none; }

        .controls { display: flex; gap: 10px; }
        .btn-start { flex: 1; height: 50px; background: var(--primary); border: none; border-radius: 12px; font-weight: 800; cursor: pointer; color: white; font-size: 0.95rem; transition: 0.3s; }
        .btn-start:disabled { background: #2d334a; cursor: not-allowed; }
        .btn-stop { width: 70px; height: 50px; background: transparent; border: 2px solid var(--danger); border-radius: 12px; font-weight: 700; color: var(--danger); cursor: pointer; display: none; }

        #status { margin-top: 12px; font-size: 0.8rem; text-align: center; color: var(--text-dim); min-height: 1.2rem; }
        .progress-bar { height: 4px; background: #2d334a; border-radius: 2px; margin-top: 8px; overflow: hidden; display: none; }
        .progress-fill { width: 0%; height: 100%; background: var(--primary); transition: 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><span>EPUB</span> STUDIO</h2>
    </div>

    <div class="config-section">
        <div class="options-bar">
            <div class="options-group">
                <label class="option-item"><input type="checkbox" id="optTrim" checked> 공백 정제</label>
                <label class="option-item"><input type="checkbox" id="optToc" checked> 목차 추출</label>
                <label class="option-item" title="체크 시 '몇 화'와 '070' 등 서로 다른 형식의 챕터 기호가 섞여 있어도 모두 목차로 추출합니다.">
                    <input type="checkbox" id="optMultiToc" checked> 🔀 다중 패턴 허용
                </label>
                <label class="option-item"><input type="checkbox" id="optZip"> ZIP 일괄 압축</label>
            </div>
            <button type="button" class="btn-advanced-toggle" id="btnToggleAdvanced">
                ⚙️ 고급 설정 <span class="arrow">▼</span>
            </button>
        </div>

        <div class="regex-area" id="advancedArea">
            <div style="font-size: 0.75rem; color: var(--accent); font-weight: 700;">목차 추출 커스텀 정규식</div>
            <input type="text" id="regexInput" value="^\s*(([<【〔]\s*(\d+[\.\s화]|제?\s*\d+화|자기\s*소개|프롤로그|에필로그|공지|작가).*?[>】〕])|제?\s*\d+[화회](?![이가을를은는의])(?:\s.{1,70})?$|(?:Chapter|Stage|Episode|Ep|Part)\s*\d+.*?|^[#＃]\d+.*?$|(?!\d*\.?\d+\s*(?:년|월|일|시|분|초|주년|세기|년대|광복절|삼일절|기념일|명절|행사|당일|미터|km|m|cm|mm|kg|g|살|세|차|퍼센트|%|배|개|명|마리|번|회분|곱하기|x|\*|위|원|달러|유로|엔|만|천|백|십|억|조|캐럿))\d*\.?\d+[\s\.화].{1,70}(?<![고다자죠요]\.)$|\(\d+\)$)\s*$">

            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border);">
                <div style="font-size: 0.75rem; color: var(--accent); font-weight: 700; margin-bottom: 8px;">🔬 파서 시뮬레이터 (엔진 테스트)</div>
                <textarea id="testInput" rows="4" placeholder="여기에 테스트할 텍스트를 복사해서 넣어보세요..."></textarea>
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <button type="button" id="btnTestParser">테스트 실행</button>
                </div>
                <div id="testOutput">감지된 제목이 이곳에 표시됩니다. (체크박스 설정 연동)</div>
            </div>
        </div>
    </div>

    <div class="file-list-area" id="dropZone">
        <div class="empty-msg" id="emptyMsg">텍스트 파일을 드래그하거나 클릭하여 추가하세요</div>
        <div class="table-wrapper" id="tableWrapper">
            <div class="table-scroll-box">
                <table class="file-table">
                    <colgroup>
                        <col style="width: auto;">
                        <col style="width: 125px;">
                        <col style="width: 85px;">
                        <col style="width: 60px;">
                        <col style="width: 75px;">
                        <col style="width: 45px;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="col-title">도서 제목</th>
                            <th>표지 설정</th>
                            <th>인코딩</th>
                            <th>감지</th>
                            <th>상태</th>
                            <th><button type="button" id="clearAllBtn" class="btn-header-action">✕</button></th>
                        </tr>
                    </thead>
                    <tbody id="fileTbody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <input type="file" id="fileInput" multiple accept=".txt" style="display:none">

    <div class="controls">
        <button type="button" class="btn-start" id="convertBtn">EPUB 변환 시작</button>
        <button type="button" class="btn-stop" id="stopBtn">중단</button>
    </div>
    <div id="status">대기 중</div>
    <div class="progress-bar" id="progBar"><div class="progress-fill" id="progFill"></div></div>
</div>

<script>
    class Store {
        constructor(initialState) {
            this.state = initialState;
            this.listeners = [];
        }
        subscribe(listener) {
            this.listeners.push(listener);
        }
        dispatch(action) {
            this.state = this.reducer(this.state, action);
            this.listeners.forEach(l => l(this.state, action));
        }
        reducer(state, action) {
            switch (action.type) {
                case 'TOGGLE_ADVANCED': return { ...state, isAdvancedOpen: !state.isAdvancedOpen };
                case 'ADD_FILES': return { ...state, files: [...state.files, ...action.payload] };
                case 'REMOVE_FILE': return { ...state, files: state.files.filter(f => f.id !== action.payload) };
                case 'CLEAR_FILES': return { ...state, files: [], progress: 0, statusText: "대기 중" };
                case 'UPDATE_FILE_TITLE': return { ...state, files: state.files.map(f => f.id === action.payload.id ? { ...f, customTitle: action.payload.title } : f) };
                case 'UPDATE_FILE_COVER': return { ...state, files: state.files.map(f => f.id === action.payload.id ? { ...f, coverBlob: action.payload.blob } : f) };
                case 'UPDATE_FILE_VALIDITY': return { ...state, files: state.files.map(f => f.id === action.payload.id ? { ...f, isValid: action.payload.isValid } : f) };
                case 'UPDATE_FILE_STATUS': return { ...state, files: state.files.map(f => f.id === action.payload.id ? { ...f, state: action.payload.status } : f) };
                case 'START_PROCESSING': return { ...state, isProcessing: true, shouldStop: false, statusText: "변환 준비 중..." };
                case 'SET_PROGRESS': return { ...state, progress: action.payload };
                case 'SET_STATUS': return { ...state, statusText: action.payload };
                case 'STOP_PROCESSING': return { ...state, shouldStop: true };
                case 'FINISH_PROCESSING': return { ...state, isProcessing: false, shouldStop: false, statusText: state.shouldStop ? "중단됨" : "모든 작업 완료!" };
                default: return state;
            }
        }
    }

    const store = new Store({ files: [], isProcessing: false, shouldStop: false, progress: 0, statusText: "대기 중", isAdvancedOpen: false });

    function el(tag, attributes = {}, ...children) {
        const element = document.createElement(tag);
        for (const [key, value] of Object.entries(attributes)) {
            if (key.startsWith('on') && typeof value === 'function') {
                element.addEventListener(key.slice(2).toLowerCase(), value);
            } else if (key === 'className') {
                element.className = value;
            } else if (key === 'style' && typeof value === 'object') {
                Object.assign(element.style, value);
            } else {
                element.setAttribute(key, value);
            }
        }
        children.forEach(child => {
            if (child instanceof Node) element.appendChild(child);
            else if (child !== null && child !== undefined && typeof child !== 'boolean') element.appendChild(document.createTextNode(child));
        });
        return element;
    }

    const dom = {
        fileInput: document.getElementById('fileInput'),
        dropZone: document.getElementById('dropZone'),
        fileTbody: document.getElementById('fileTbody'),
        tableWrapper: document.getElementById('tableWrapper'),
        emptyMsg: document.getElementById('emptyMsg'),
        convertBtn: document.getElementById('convertBtn'),
        stopBtn: document.getElementById('stopBtn'),
        regexInput: document.getElementById('regexInput'),
        optToc: document.getElementById('optToc'),
        optTrim: document.getElementById('optTrim'),
        optZip: document.getElementById('optZip'),
        optMultiToc: document.getElementById('optMultiToc'),
        statusText: document.getElementById('status'),
        progFill: document.getElementById('progFill'),
        progBar: document.getElementById('progBar'),
        clearAllBtn: document.getElementById('clearAllBtn'),
        btnToggleAdvanced: document.getElementById('btnToggleAdvanced'),
        advancedArea: document.getElementById('advancedArea'),
        testInput: document.getElementById('testInput'),
        btnTestParser: document.getElementById('btnTestParser'),
        testOutput: document.getElementById('testOutput')
    };

    dom.btnToggleAdvanced.onclick = () => store.dispatch({ type: 'TOGGLE_ADVANCED' });

    dom.btnTestParser.onclick = () => {
        const text = dom.testInput.value;
        const regex = dom.regexInput.value;
        const useMultiToc = dom.optMultiToc.checked;

        if (!text.trim()) {
            dom.testOutput.innerHTML = '<span style="color:var(--danger)">테스트할 텍스트를 입력해주세요.</span>';
            return;
        }
        dom.testOutput.innerHTML = '엔진 분석 중...';
        parserWorker.postMessage({ type: 'TEST_PARSER', payload: { text, userRegex: regex, useMultiToc } });
    };

    store.subscribe((state, action) => {
        dom.convertBtn.disabled = state.isProcessing;
        dom.stopBtn.style.display = (state.isProcessing && !state.shouldStop) ? 'block' : 'none';
        dom.progBar.style.display = state.isProcessing ? 'block' : 'none';
        dom.progFill.style.width = `${state.progress}%`;
        dom.statusText.innerText = state.statusText;
        dom.emptyMsg.style.display = state.files.length ? 'none' : 'block';
        dom.tableWrapper.classList.toggle('active', state.files.length > 0);

        if (state.isAdvancedOpen) {
            dom.advancedArea.classList.add('open');
            dom.btnToggleAdvanced.classList.add('open');
        } else {
            dom.advancedArea.classList.remove('open');
            dom.btnToggleAdvanced.classList.remove('open');
        }

        if (['ADD_FILES', 'REMOVE_FILE', 'CLEAR_FILES', 'UPDATE_FILE_VALIDITY', 'UPDATE_FILE_STATUS', 'UPDATE_FILE_COVER'].includes(action.type)) {
            renderList(state.files);
        }
    });

    function renderList(files) {
        dom.fileTbody.innerHTML = '';
        files.forEach((item) => {
            const hasCover = !!item.coverBlob;
            const row = el('tr', {},
                el('td', { className: 'col-title' }, el('input', { type: 'text', className: 'title-input', value: item.customTitle, onInput: (e) => store.dispatch({ type: 'UPDATE_FILE_TITLE', payload: { id: item.id, title: e.target.value } }) })),
                el('td', {},
                    el('div', { className: 'cover-btn-group' },
                        el('button', { className: 'btn-cover', onClick: () => window.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(item.customTitle)}`, '_blank') }, '검색'),
                        el('button', { className: 'btn-cover' + (hasCover ? ' active' : ''), onClick: () => readClipboardImage(item.id) }, '클립보드')
                    )
                ),
                el('td', {}, item.encoding),
                el('td', {}, el('span', { style: { color: item.isValid === 'ok' ? 'var(--success)' : 'var(--danger)' } }, item.isValid === 'ok' ? '✓' : '!') ),
                el('td', {}, el('span', { className: `status-badge badge-${item.state}` }, item.state)),
                el('td', {}, el('button', { className: 'btn-header-action', onClick: () => store.dispatch({ type: 'REMOVE_FILE', payload: item.id }) }, '✕') )
            );
            dom.fileTbody.appendChild(row);
        });
    }

    async function readClipboardImage(id) {
        store.dispatch({ type: 'SET_STATUS', payload: "클립보드 분석 중..." });
        try {
            const items = await navigator.clipboard.read();
            for (const item of items) {
                const imageType = item.types.find(type => type.startsWith('image/'));
                if (imageType) {
                    const blob = await item.getType(imageType);
                    store.dispatch({ type: 'UPDATE_FILE_COVER', payload: { id, blob } });
                    store.dispatch({ type: 'SET_STATUS', payload: "클립보드 이미지 적용 완료" });
                    return;
                }
            }
            const text = await navigator.clipboard.readText();
            if (text && (text.startsWith('http://') || text.startsWith('https://'))) {
                store.dispatch({ type: 'SET_STATUS', payload: "이미지 다운로드 중..." });
                const res = await fetch(text);
                if (!res.ok) throw new Error();
                const blob = await res.blob();
                store.dispatch({ type: 'UPDATE_FILE_COVER', payload: { id, blob } });
                store.dispatch({ type: 'SET_STATUS', payload: "원격 이미지 캐싱 완료" });
                return;
            }
            alert("클립보드에 유효한 이미지 또는 주소가 없습니다.");
            store.dispatch({ type: 'SET_STATUS', payload: "클립보드 판독 실패" });
        } catch (e) {
            alert("클립보드를 읽을 수 없습니다.\n브라우저 권한을 확인하시거나 CORS 정책이 제한된 주소입니다.");
            store.dispatch({ type: 'SET_STATUS', payload: "권한 거부 또는 CORS 오류" });
        }
    }

    const workerCode = `
        importScripts("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");

        class ClusterParser {
            constructor(customRegexStr = null) {
                this.customRegex = customRegexStr ? new RegExp(customRegexStr, 'i') : null;
                this.bannedRegex = /((?:\\d+\\.\\d+)|(?:\\d+[\\/\\\\]\\d+))\\s*(?:캐럿|만|억|천|밀리언|달러|원|퍼센트|%|미터|km|m|cm|mm|kg|g|초|분|시간|배|위)|(?:총|약|단|무려|겨우|고작|단지)\\s*\\d+\\s*[장회화편부]|\\d+\\s*(?:년|월|일|시|분|초|주년|세기|년대|광복절|삼일절|기념일|명절|행사|당일|살|세|차|퍼센트|%|배|개|명|마리|번|회분|곱하기)/i;
            }

            analyze(lines, useMultiToc = false) {
                const groupCounts = {};
                const lineData = new Array(lines.length).fill(null);

                for (let i = 0; i < lines.length; i++) {
                    let t = lines[i].replace(/[\\u200B-\\u200D\\uFEFF]/g, '').trim();
                    if (!t || t.length > 90) continue;

                    if (/^[-—~]?\\s*["'”’「『“‘]/.test(t)) continue;

                    const isStrongStart =
                        /^[<【〔\\[(]?\\s*(?:제\\s*)?\\d+\\s*[화회장막편부](?:\\s|:|\\.|-|$)/i.test(t) ||
                        /^(?:Chapter|Stage|Episode|Ep|Part|Track|Season)\\s*\\d+/i.test(t) ||
                        /^[#＃]\\d+/.test(t) ||
                        /^\\d+[-_]\\d+(?:\\s|$)/.test(t) ||
                        /^\\d+\\.\\s/.test(t) ||
                        /^0\\d{1,3}(?:\\s|$)/.test(t);

                    if (/\\d+\\s*[화회장막편부](?:[이가을를은는에로와과의]|에서|으로|부터|까지|쯤|정도|분량|라는|란|만|도|면|아닌|인가|일까|인지)/.test(t)) continue;

                    if (/[다요네지음니까야라자고대군걸죠셔가냐어워][.?!~"”'’\\s]*$/.test(t)) {
                        if (!isStrongStart && t.length > 12) continue;
                        if (isStrongStart && t.length > 60) continue;
                    }

                    const korMatchForFilter = t.match(/(?:제\\s*)?\\d+\\s*[화회장막편부]/);
                    if (korMatchForFilter && !isStrongStart && korMatchForFilter.index > 15 && /[.?!]$/.test(t)) continue;

                    if (this.bannedRegex.test(t) && !isStrongStart) continue;

                    const prevE = (i === 0 || lines[i-1].trim() === "");
                    const nextE = (i === lines.length-1 || lines[i+1].trim() === "");

                    let matchedGroup = null;
                    let match;

                    if (/^(?:프롤로그|에필로그|외전|공지|작가의\\s*말|서장|종장|프로필)/.test(t)) {
                        matchedGroup = 'SPECIAL';
                    } else if ((match = t.match(/(?:제\\s*)?\\d+\\s*([화회장막편부])/))) {
                        matchedGroup = 'KOR_' + match[1];
                    } else if ((match = t.match(/^(Chapter|Stage|Episode|Ep|Part|Track|Season)\\s*\\d+/i))) {
                        matchedGroup = 'ENG_' + match[1].toUpperCase();
                    } else if (/^[<【〔\\[].+?[>】〕\\]]/.test(t)) {
                        matchedGroup = 'BRACKET';
                    } else if (/^[#＃]\\d+/.test(t)) {
                        matchedGroup = 'SHARP';
                    }
                    else if (/^\\d+[-_]\\d+(?:\\s|$)/.test(t) || /^\\d+\\.\\s/.test(t) || /^0\\d{1,3}(?:\\s|$)/.test(t) || /^\\d{1,5}$/.test(t)) {
                        matchedGroup = 'NUMBER';
                    } else if (this.customRegex && this.customRegex.test(t)) {
                        matchedGroup = 'CUSTOM';
                    }

                    if (matchedGroup) {
                        if (!isStrongStart && matchedGroup !== 'SPECIAL' && matchedGroup !== 'BRACKET') {
                            if (!prevE || !nextE) continue;
                        }

                        groupCounts[matchedGroup] = (groupCounts[matchedGroup] || 0) + 1;
                        lineData[i] = matchedGroup;
                    }
                }

                const activeGroups = new Set(['SPECIAL']);
                if (groupCounts['CUSTOM'] > 0) activeGroups.add('CUSTOM');

                if (useMultiToc) {
                    for (const [group, count] of Object.entries(groupCounts)) {
                        if (group !== 'SPECIAL' && group !== 'CUSTOM' && count >= 1) {
                            activeGroups.add(group);
                        }
                    }
                } else {
                    let bestGroup = null;
                    let bestCount = 0;
                    let bestTier = -1;

                    const getTier = (g) => {
                        if (g.startsWith('KOR')) return 3;
                        if (g.startsWith('ENG')) return 3;
                        if (g === 'BRACKET') return 2;
                        if (g === 'SHARP') return 2;
                        if (g === 'NUMBER') return 1;
                        return 0;
                    };

                    for (const [group, count] of Object.entries(groupCounts)) {
                        if (group !== 'SPECIAL' && group !== 'CUSTOM') {
                            const tier = getTier(group);
                            if (tier > bestTier) {
                                bestTier = tier;
                                bestCount = count;
                                bestGroup = group;
                            } else if (tier === bestTier) {
                                if (count > bestCount) {
                                    bestCount = count;
                                    bestGroup = group;
                                }
                            }
                        }
                    }
                    if (bestGroup && bestCount >= 1) activeGroups.add(bestGroup);
                }

                const validIndices = new Set();
                lineData.forEach((group, i) => { if (group && activeGroups.has(group)) validIndices.add(i); });
                return validIndices;
            }
        }

        const esc = (s) => s.replace(/[<>&"']/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":"&apos;"}[m]));

        self.onmessage = async function(e) {
            try {
                const { type, payload } = e.data;
                const safeSplit = (text) => text.split(/\\r\\n|\\n|\\r/);

                if (type === 'TEST_PARSER') {
                    const parser = new ClusterParser(payload.userRegex);
                    const lines = safeSplit(payload.text);
                    const validIndices = parser.analyze(lines, payload.useMultiToc);
                    const resultLines = [];
                    validIndices.forEach(i => resultLines.push(lines[i]));
                    self.postMessage({ type: 'TEST_RESULT', payload: { resultLines, total: lines.length } });
                }
                else if (type === 'VALIDATE') {
                    const parser = new ClusterParser(payload.userRegex);
                    const lines = safeSplit(payload.text);
                    const validIndices = parser.analyze(lines, payload.useMultiToc);
                    self.postMessage({ type: 'VALIDATE_RESULT', payload: { id: payload.id, isValid: validIndices.size > 0 ? 'ok' : 'no' } });
                }
                else if (type === 'CONVERT') {
                    const { id, title, content, useTrim, useAutoToc, useMultiToc, userRegex, coverBuffer } = payload;
                    const parser = new ClusterParser(userRegex);
                    const rawLines = safeSplit(content);

                    const validIndices = useAutoToc ? parser.analyze(rawLines, useMultiToc) : new Set();
                    const chapters = [];
                    let currentChapter = { title: "시작", lines: [] };
                    let consecutiveEmptyLines = 0;

                    rawLines.forEach((line, i) => {
                        const trimmed = line.trim();
                        const isTitle = validIndices.has(i);

                        if (isTitle) {
                            if (currentChapter.lines.length > 0) chapters.push(currentChapter);
                            currentChapter = { title: trimmed, lines: [] };
                            consecutiveEmptyLines = 0;
                            return;
                        }

                        if (trimmed === "") {
                            consecutiveEmptyLines++;
                            if (useTrim && consecutiveEmptyLines > 1) return;
                            currentChapter.lines.push("");
                        } else {
                            consecutiveEmptyLines = 0;
                            currentChapter.lines.push(useTrim ? line.trimEnd() : line);
                        }
                    });
                    chapters.push(currentChapter);

                    const zip = new JSZip();
                    zip.file("mimetype", "application/epub+zip", { compression: "STORE" });
                    zip.folder("META-INF").file("container.xml", '<?xml version="1.0" encoding="UTF-8"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');

                    const oebps = zip.folder("OEBPS");
                    const manifest = [], spine = [], nav = [], ncx = [];

                    if (coverBuffer) {
                        oebps.folder("images").file("cover.jpg", coverBuffer);
                        oebps.file("cover.xhtml", '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ko"><head><title>Cover</title><style>body { margin: 0; padding: 0; text-align: center; background-color: #0d111d; } img { max-width: 100%; max-height: 100vh; object-fit: contain; margin: 0 auto; }</style></head><body><img src="images/cover.jpg" alt="Cover" /></body></html>');
                        manifest.push('<item id="cover" href="cover.xhtml" media-type="application/xhtml+xml"/>');
                        manifest.push('<item id="cover-img" href="images/cover.jpg" media-type="image/jpeg" properties="cover-image"/>');
                        spine.push('<itemref idref="cover"/>');
                    }

                    chapters.forEach((ch, idx) => {
                        const fname = "ch_" + idx + ".xhtml";
                        const safeTitle = esc(ch.title);
                        const bodyHtml = ch.lines.map(l => l ? "<p>" + esc(l) + "</p>" : "<p><br/></p>").join('\\n');

                        oebps.file(fname, '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ko"><head><title>' + safeTitle + '</title><style>body { font-family: sans-serif; line-height: 1.7; padding: 5% 7%; word-break: break-all; } h2 { border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 1.25em; color: #333; } p { margin: 0.8em 0; text-indent: 0.5em; }</style></head><body><h2>' + safeTitle + '</h2>' + bodyHtml + '</body></html>');

                        manifest.push("<item id=\\"c" + idx + "\\" href=\\"" + fname + "\\" media-type=\\"application/xhtml+xml\\"/>");
                        spine.push("<itemref idref=\\"c" + idx + "\\"/>");
                        nav.push("<li><a href=\\"" + fname + "\\">" + safeTitle + "</a></li>");
                        ncx.push("<navPoint id=\\"n" + idx + "\\" playOrder=\\"" + (idx + 1) + "\\"><navLabel><text>" + safeTitle + "</text></navLabel><content src=\\"" + fname + "\\"/></navPoint>");
                    });

                    oebps.file("nav.xhtml", '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><body><nav epub:type="toc"><h1>목차</h1><ol>' + nav.join('\\n') + '</ol></nav></body></html>');
                    oebps.file("toc.ncx", '<?xml version="1.0" encoding="UTF-8"?><ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"><head><meta name="dtb:uid" content="uuid"/></head><docTitle><text>' + esc(title) + '</text></docTitle><navMap>' + ncx.join('\\n') + '</navMap></ncx>');

                    const randomId = Math.random().toString(36).substring(2, 15);
                    const coverMeta = coverBuffer ? '<meta name="cover" content="cover-img"/>' : '';

                    oebps.file("content.opf", '<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="uid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="uid">u' + randomId + '</dc:identifier><dc:title>' + esc(title) + '</dc:title><dc:language>ko</dc:language>' + coverMeta + '<meta property="dcterms:modified">' + new Date().toISOString().replace(/\\.\\d+Z$/, "Z") + '</meta></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>' + manifest.join('\\n') + '</manifest><spine toc="ncx">' + spine.join('\\n') + '</spine></package>');

                    const blob = await zip.generateAsync({ type: "blob", mimeType: "application/epub+zip", compression: "DEFLATE" });
                    self.postMessage({ type: 'CONVERT_RESULT', payload: { id, blob } });
                }
            } catch (err) {
                self.postMessage({ type: 'ERROR', payload: { id: e.data?.payload?.id, error: err.toString() } });
            }
        };
    `;

    const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    const parserWorker = new Worker(URL.createObjectURL(workerBlob));
    const conversionResolvers = new Map();

    parserWorker.onerror = (err) => {
        console.error("Worker Global Error:", err);
        dom.testOutput.innerHTML = '<span style="color:var(--danger)">엔진 치명적 오류: 정규식 문법 또는 스크립트 에러 (' + err.message + ')</span>';
    };

    parserWorker.onmessage = (e) => {
        const { type, payload } = e.data;
        if (type === 'TEST_RESULT') {
            if (payload.resultLines.length === 0) {
                dom.testOutput.innerHTML = '<span style="color:var(--danger)">감지된 제목이 없습니다. (모두 본문으로 판정됨)</span>';
            } else {
                dom.testOutput.innerHTML = '<strong style="color:var(--success)">총 ' + payload.resultLines.length + '개 감지됨:</strong><div style="margin-top:8px;">' + payload.resultLines.map(l => '<div style="padding: 3px 0; border-bottom: 1px dashed #2d334a;">' + l.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>').join('') + '</div>';
            }
        }
        else if (type === 'VALIDATE_RESULT') {
            store.dispatch({ type: 'UPDATE_FILE_VALIDITY', payload });
        }
        else if (type === 'CONVERT_RESULT') {
            if (conversionResolvers.has(payload.id)) {
                conversionResolvers.get(payload.id).resolve(payload.blob);
                conversionResolvers.delete(payload.id);
            }
        }
        else if (type === 'ERROR') {
            console.error("Worker Error:", payload.error);
            if (payload.id && conversionResolvers.has(payload.id)) {
                conversionResolvers.get(payload.id).reject(new Error(payload.error));
                conversionResolvers.delete(payload.id);
            } else if (!payload.id) {
                dom.testOutput.innerHTML = '<span style="color:var(--danger)">파서 오류: ' + payload.error + '</span>';
            }
        }
    };

    dom.dropZone.onclick = (e) => { if (!e.target.closest('button') && !e.target.closest('input') && !e.target.closest('textarea')) dom.fileInput.click(); };
    dom.dropZone.ondragover = (e) => { e.preventDefault(); dom.dropZone.classList.add('drag-over'); };
    dom.dropZone.ondragleave = () => dom.dropZone.classList.remove('drag-over');
    dom.dropZone.ondrop = (e) => { e.preventDefault(); dom.dropZone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); };
    dom.fileInput.onchange = (e) => { if (e.target.files.length > 0) handleFiles(e.target.files); e.target.value = ""; };

    async function handleFiles(files) {
        const newFiles = [];
        for (const file of Array.from(files)) {
            if (!file.name.toLowerCase().endsWith('.txt')) continue;

            const buf = await file.slice(0, 32768).arrayBuffer();
            let bin = "";
            new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));

            let det = jschardet.detect(bin);
            let enc = (det && det.confidence > 0.7) ? det.encoding.toUpperCase() : 'UTF-8';
            if (["EUC-KR", "CP949"].includes(enc)) enc = "CP949";

            newFiles.push({
                id: Date.now()+'-'+Math.random(),
                file,
                customTitle: file.name.replace(/\.[^/.]+$/, "").replace(/(?<=[가-힣\w])\+(?=[가-힣\w])/g, ' '),
                encoding: enc,
                state: 'wait',
                isValid: 'none',
                coverBlob: null
            });
        }
        store.dispatch({ type: 'ADD_FILES', payload: newFiles });
        validateFiles();
    }

    async function validateFiles() {
        for (let item of store.state.files) {
            if (item.isValid !== 'none') continue;
            const text = await new Promise((r, rej) => {
                const fr = new FileReader();
                fr.onload = e => r(e.target.result.substring(0, 15000));
                fr.onerror = () => rej();
                fr.readAsText(item.file, item.encoding);
            });
            parserWorker.postMessage({ type: 'VALIDATE', payload: { id: item.id, text, userRegex: dom.regexInput.value, useMultiToc: dom.optMultiToc.checked } });
        }
    }

    dom.convertBtn.onclick = async () => {
        if (!store.state.files.length) return;
        store.dispatch({ type: 'START_PROCESSING' });

        const finalZip = dom.optZip.checked ? new JSZip() : null;
        const useMultiToc = dom.optMultiToc.checked;

        for (let i = 0; i < store.state.files.length; i++) {
            if (store.state.shouldStop) break;
            const item = store.state.files[i];
            if (item.state === 'done') continue;

            store.dispatch({ type: 'UPDATE_FILE_STATUS', payload: { id: item.id, status: 'ing' } });

            try {
                const text = await new Promise((res, rej) => {
                    const fr = new FileReader();
                    fr.onload = e => res(e.target.result);
                    fr.onerror = () => rej(new Error("File Read Failed"));
                    fr.readAsText(item.file, item.encoding);
                });

                const coverBuf = item.coverBlob ? await item.coverBlob.arrayBuffer() : null;

                const blob = await new Promise((resolve, reject) => {
                    conversionResolvers.set(item.id, { resolve, reject });
                    parserWorker.postMessage({
                        type: 'CONVERT',
                        payload: {
                            id: item.id,
                            title: item.customTitle,
                            content: text,
                            useTrim: dom.optTrim.checked,
                            useAutoToc: dom.optToc.checked,
                            useMultiToc,
                            userRegex: dom.regexInput.value,
                            coverBuffer: coverBuf
                        }
                    }, coverBuf ? [coverBuf] : []);
                });

                if (finalZip) {
                    finalZip.file(`${item.customTitle}.epub`, blob);
                } else {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `${item.customTitle}.epub`;
                    a.click();
                }
                store.dispatch({ type: 'UPDATE_FILE_STATUS', payload: { id: item.id, status: 'done' } });
            } catch (e) {
                store.dispatch({ type: 'UPDATE_FILE_STATUS', payload: { id: item.id, status: 'error' } });
            }
            store.dispatch({ type: 'SET_PROGRESS', payload: ((i + 1) / store.state.files.length) * 100 });
        }
        if (finalZip && !store.state.shouldStop) {
            const b = await finalZip.generateAsync({ type: "blob" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = `EPUB_COLLECTION.zip`;
            a.click();
        }
        store.dispatch({ type: 'FINISH_PROCESSING' });
    };

    dom.stopBtn.onclick = () => store.dispatch({ type: 'STOP_PROCESSING' });
    dom.clearAllBtn.onclick = () => { if (!store.state.isProcessing) store.dispatch({ type: 'CLEAR_FILES' }); };
</script>
</body>
